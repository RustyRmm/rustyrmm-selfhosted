# Production stack: RustyRMM + Postgres, published either by Caddy
# (automatic Let's Encrypt HTTPS) or a Cloudflare Tunnel. Remote desktop is
# built into RustyRMM; a self-hosted RustDesk ID/relay server is an optional
# add-on.
#
#   cp sample.env .env     # set RMM_DOMAIN, passwords and COMPOSE_PROFILES
#                          # (which optional services run); see README.md
#   docker compose pull && docker compose up -d
#
# Profiles (COMPOSE_PROFILES in .env):
#   caddy     HTTPS on this host's ports 80/443 with Let's Encrypt
#   tunnel    Cloudflare Tunnel (no inbound ports; set CLOUDFLARE_TUNNEL_TOKEN)
#   rustdesk  optional RustDesk add-on server (needs TCP 21115-21117 + UDP 21116
#             reachable); not needed for the built-in remote view
#
# Already run a reverse proxy or tunnel? Leave caddy and tunnel out of
# COMPOSE_PROFILES and either publish the server's port with expose.yml
# (COMPOSE_FILE=docker-compose.yml:expose.yml) or attach your proxy container
# to the rustyrmm_default network and target http://rustyrmm:8080.
name: rustyrmm

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rmm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rmm
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmm"]
      interval: 10s
      retries: 5

  rustyrmm:
    # Published image; set RMM_IMAGE in .env to pin a version, e.g.
    # smugzombie/rustyrmm:0.27.0.
    # Serves plain HTTP on 8080 inside the compose network; nothing is
    # published on the host unless expose.yml is used.
    image: ${RMM_IMAGE:-smugzombie/rustyrmm:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rmm:${POSTGRES_PASSWORD}@postgres:5432/rmm
      RMM_PUBLIC_URL: https://${RMM_DOMAIN:?set RMM_DOMAIN in .env}
      RMM_ADMIN_EMAIL: ${RMM_ADMIN_EMAIL:-admin@localhost}
      RMM_ADMIN_PASSWORD: ${RMM_ADMIN_PASSWORD:-}
      RMM_UPDATE_PUBKEY: ${RMM_UPDATE_PUBKEY:-}
      RMM_RELEASE_GITHUB_REPO: ${RMM_RELEASE_GITHUB_REPO:-}
      RMM_RELEASE_GITHUB_TOKEN: ${RMM_RELEASE_GITHUB_TOKEN:-}
      RMM_RELEASE_FEED_URL: ${RMM_RELEASE_FEED_URL:-}
      RMM_RELEASE_SYNC_HOURS: ${RMM_RELEASE_SYNC_HOURS:-}
      RMM_RELEASE_AUTO_PROMOTE: ${RMM_RELEASE_AUTO_PROMOTE:-}
      # Signed vulnerability feed; defaults to the releases repository's
      # `vulnfeed` release. `off` disables vulnerability monitoring.
      RMM_VULN_FEED_URL: ${RMM_VULN_FEED_URL:-}
      RMM_VULN_FEED_HOURS: ${RMM_VULN_FEED_HOURS:-}
      RMM_WEBHOOK_ALLOW_PRIVATE: ${RMM_WEBHOOK_ALLOW_PRIVATE:-}
      # Encrypts the backup S3 secret access key at rest. Set it before
      # configuring an S3 backup target; keep it stable (losing it means
      # re-entering the S3 secret).
      RMM_SECRET_KEY: ${RMM_SECRET_KEY:-}
      # Only used with the optional rustdesk profile. Behind a Cloudflare
      # Tunnel the console name isn't reachable for RustDesk's raw ports, so it
      # can be given its own (DNS-only) name. Without the profile no key is
      # generated and RustDesk stays off.
      RMM_RUSTDESK_HOST: ${RMM_RUSTDESK_HOST:-${RMM_DOMAIN}}
      RMM_RUSTDESK_KEY_FILE: /rustdesk/id_ed25519.pub
    volumes:
      - data:/var/lib/rustyrmm
      - rustdesk:/rustdesk:ro

  caddy:
    image: caddy:2-alpine
    profiles: [caddy]
    restart: unless-stopped
    depends_on: [rustyrmm]
    environment:
      RMM_DOMAIN: ${RMM_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

  # Cloudflare Tunnel: outbound-only connection to Cloudflare, which serves
  # https://RMM_DOMAIN with its own certificate. Route the public hostname to
  # http://rustyrmm:8080 in the Cloudflare dashboard (see README.md, and
  # /docs/deployment/cloudflare-tunnel on your server for details).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: [tunnel]
    restart: unless-stopped
    depends_on: [rustyrmm]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

  # Optional RustDesk add-on: ID server and relay. Agents are configured
  # automatically with RMM_RUSTDESK_HOST and the generated public key.
  hbbs:
    image: rustdesk/rustdesk-server:1
    profiles: [rustdesk]
    command: hbbs
    restart: unless-stopped
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
    volumes:
      - rustdesk:/root
    depends_on: [hbbr]

  hbbr:
    image: rustdesk/rustdesk-server:1
    profiles: [rustdesk]
    command: hbbr
    restart: unless-stopped
    ports:
      - "21117:21117"
    volumes:
      - rustdesk:/root

volumes:
  postgres:
  data:
  caddy:
  rustdesk:
